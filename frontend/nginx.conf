server {
    listen 80;
    server_name localhost;

    # Serve static React UI
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api requests to NestJS container or host backend
    location /api/ {
        proxy_pass http://host.docker.internal:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy /static static asset requests to NestJS backend
    location /static/ {
        proxy_pass http://host.docker.internal:4000/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}